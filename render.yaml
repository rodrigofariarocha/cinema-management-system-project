databases:
  - name: cinemarocha-db
    databaseName: cinemarocha
    user: cinema
    plan: free

services:
  - type: web
    name: cinemarocha
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cinemarocha-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Password do admin gerada pelo Render (ve-la em Environment no painel)
      - key: ADMIN_PASSWORD
        generateValue: true
      # Chaves: preenche-as no painel do Render (Environment).
      # sync:false = o Render pede-tas e nunca as guarda no repositorio.
      - key: Tmdb__ApiKey
        sync: false
      - key: Tmdb__BearerToken
        sync: false
      - key: Omdb__ApiKey
        sync: false
      - key: Gemini__ApiKey
        sync: false
      # Email: SmtpEnabled tem de estar a true para o envio acontecer
      - key: EmailSettings__SmtpEnabled
        value: "true"
      - key: EmailSettings__FromEmail
        sync: false
      - key: EmailSettings__SmtpUsername
        sync: false
      - key: EmailSettings__SmtpPassword
        sync: false
